# Flo Home X6 — Lovelace dashboard (v2 local OCPP bridge)
# Entity IDs assume the default MQTT-discovery device "Flo Home X6" (slug: flo_home_x6).
# If you set FLO_DEVICE_NAME/FLO_DEVICE_ID differently, adjust the slugs below.
type: sections
max_columns: 4
title: EV-charger
path: ev-charger
icon: mdi:ev-station
subview: true
cards: []
sections:
  - type: grid
    cards:
      - type: heading
        heading: Status
      - type: glance
        show_name: false
        show_icon: true
        show_state: true
        entities:
          - entity: binary_sensor.flo_home_x6_charging
          - entity: binary_sensor.flo_home_x6_plugged_in
  - type: grid
    cards:
      - type: heading
        heading: Live Session
      - type: gauge
        entity: sensor.flo_home_x6_power
        name: Power
        unit: W
        min: 0
        max: 11520
        needle: true
        segments:
          - from: 0
            color: '#9e9e9e'
          - from: 100
            color: '#44739e'
          - from: 7000
            color: '#39bd39'
          - from: 10000
            color: '#e8a400'
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.flo_home_x6_plugged_in
            state: 'on'
          - condition: state
            entity: binary_sensor.flo_home_x6_charging
            state: 'off'
        card:
          type: button
          entity: button.flo_home_x6_start_charging
          name: Start Charge
          icon: mdi:play-circle-outline
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.flo_home_x6_start_charging
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.flo_home_x6_charging
            state: 'on'
        card:
          type: button
          entity: button.flo_home_x6_stop_charging
          name: Stop Charge
          icon: mdi:stop-circle-outline
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.flo_home_x6_stop_charging
      - type: entities
        entities:
          - entity: sensor.flo_home_x6_status
            name: EVSE Status
          - entity: sensor.flo_home_x6_current
            name: Current
          - entity: sensor.flo_home_x6_current_offered
            name: Current Offered
          - entity: sensor.flo_home_x6_voltage
            name: Voltage
          - entity: sensor.flo_home_x6_session_energy
            name: Session Energy
          - entity: sensor.flo_home_x6_total_energy
            name: Total Energy
  - type: grid
    cards:
      - type: heading
        heading: History
      - type: history-graph
        title: Power & Current (2h)
        hours_to_show: 2
        refresh_interval: 30
        entities:
          - entity: sensor.flo_home_x6_power
            name: Power (W)
          - entity: sensor.flo_home_x6_current
            name: Current (A)
      - type: statistics-graph
        title: Daily Energy (7 days)
        period: day
        days_to_show: 7
        chart_type: bar
        stat_types:
          - change
        entities:
          - entity: sensor.flo_home_x6_total_energy
            name: kWh
  - type: grid
    cards:
      - type: heading
        heading: Link & Control
        heading_style: title
      - type: glance
        show_name: true
        show_icon: true
        show_state: true
        entities:
          - entity: binary_sensor.flo_home_x6_ocpp_connected
            name: OCPP Link
      - type: entities
        entities:
          - entity: sensor.flo_home_x6_last_seen
            name: Last Seen
          - entity: switch.flo_home_x6_charge_lock_2
