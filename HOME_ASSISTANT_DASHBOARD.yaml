# Flo Home X6 — Lovelace dashboard (v2 local OCPP bridge)
# Entity IDs assume the default MQTT-discovery device "Flo Home X6" (slug: flo_home_x6).
# If you set FLO_DEVICE_NAME/FLO_DEVICE_ID differently, adjust the slugs below.
type: sections
max_columns: 4
title: EV Charger
path: ev-charger
icon: mdi:ev-station
cards: []
sections:
  # ---------------- Status + controls ----------------
  - type: grid
    cards:
      - type: heading
        heading: Status
      - type: glance
        show_name: true
        show_icon: true
        show_state: true
        entities:
          - entity: sensor.flo_home_x6_status
            name: State
          - entity: binary_sensor.flo_home_x6_plugged_in
            name: Plugged
          - entity: binary_sensor.flo_home_x6_charging
            name: Charging
      - type: tile
        entity: switch.flo_home_x6_charge_lock
        name: Charge Lock
        icon: mdi:lock
      # Start button — only when plugged and not already charging
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.flo_home_x6_plugged_in
            state: "on"
          - condition: state
            entity: binary_sensor.flo_home_x6_charging
            state: "off"
        card:
          type: button
          entity: button.flo_home_x6_start_charging
          name: Start Charging
          icon: mdi:play-circle-outline
          tap_action: { action: toggle }
      # Stop button — only while charging
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.flo_home_x6_charging
            state: "on"
        card:
          type: button
          entity: button.flo_home_x6_stop_charging
          name: Stop Charging
          icon: mdi:stop-circle-outline
          tap_action: { action: toggle }

  # ---------------- Live session ----------------
  - type: grid
    cards:
      - type: heading
        heading: Live Session
      - type: gauge
        entity: sensor.flo_home_x6_power
        name: Power
        unit: W
        min: 0
        max: 11520          # 48 A x 240 V (your installed rotary-switch max)
        needle: true
        segments:
          - { from: 0, color: "#9e9e9e" }
          - { from: 100, color: "#44739e" }
          - { from: 7000, color: "#39bd39" }
          - { from: 10000, color: "#e8a400" }
      - type: entities
        entities:
          - entity: sensor.flo_home_x6_current
            name: Current
          - entity: sensor.flo_home_x6_current_offered
            name: Current Offered (dial)
          - entity: sensor.flo_home_x6_voltage
            name: Voltage
          - entity: sensor.flo_home_x6_session_energy
            name: Session Energy

  # ---------------- History ----------------
  - type: grid
    cards:
      - type: heading
        heading: History
      - type: statistic
        entity: sensor.flo_home_x6_total_energy
        name: Lifetime Energy
        stat_type: change
        period:
          calendar: { period: month }
      - type: history-graph
        hours_to_show: 48
        entities:
          - entity: sensor.flo_home_x6_power
          - entity: binary_sensor.flo_home_x6_charging
