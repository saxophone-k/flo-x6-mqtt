services:
  flo-x6-mqtt:
    image: ghcr.io/saxophone-k/flo-x6-mqtt:latest
    container_name: flo-x6-mqtt
    restart: unless-stopped
    env_file: .env
    ports:
      # The charger connects INBOUND to this port. The host must be reachable
      # from the charger's network (e.g. same VLAN as the charger).
      - "9000:9000"
    # Alternatively use host networking so the container binds the host IP directly:
    #   network_mode: host
