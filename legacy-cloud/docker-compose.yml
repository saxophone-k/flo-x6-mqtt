services:
  flo-x6-mqtt:
    image: flo-x6-mqtt:local
    build: .
    container_name: flo-x6-mqtt
    restart: unless-stopped
    environment:
      - FLO_USERNAME=your@email.com
      - FLO_PASSWORD=yourpassword
      - HASS_MQTT_HOST=192.168.10.100
      - HASS_MQTT_PORT=1883
      - HASS_MQTT_USERNAME=
      - HASS_MQTT_PASSWORD=
      - POLL_INTERVAL_CHARGING=30
      - POLL_INTERVAL_PLUGGED=60
      - POLL_INTERVAL_AVAILABLE=120
      - POLL_INTERVAL_RETRY=60
      - API_TIMEOUT=10
      - CONSECUTIVE_ERRORS_THRESHOLD=3
      - LOG_LEVEL=INFO
    volumes:
      - flo-x6-mqtt-data:/app/data

volumes:
  flo-x6-mqtt-data:
